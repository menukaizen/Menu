<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Yönetim Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #e84118; --bg: #f5f6fa; --dark: #2f3640; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg); color: var(--dark); }
        #login-screen { position: fixed; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 10px; width: 300px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .login-box input, .login-box button { width: 100%; margin-top: 15px; padding: 12px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .login-box button { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        #main-app { display: none; padding: 20px; max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        .btn { padding: 10px 15px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn-red { background: #c23616; }
        .form-card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 30px; display: grid; gap: 15px; grid-template-columns: 1fr 1fr; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: span 2; }
        .form-group input, .form-group select, .form-group textarea { padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f1f2f6; }
        td img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Yönetici Girişi</h2>
            <input type="email" id="email" placeholder="E-posta">
            <input type="password" id="password" placeholder="Şifre">
            <button id="loginBtn">Giriş Yap</button>
            <p id="errorMsg" style="color:red; font-size:12px; display:none;">Hatalı giriş!</p>
        </div>
    </div>

    <div id="main-app">
        <div class="header">
            <h2>Menü Yönetimi</h2>
            <button id="logoutBtn" class="btn btn-red">Çıkış Yap</button>
        </div>

        <div class="form-card">
            <div class="form-group full"><h3>Yeni Ürün Ekle</h3></div>
            <div class="form-group">
                <label>Ürün Adı</label>
                <input type="text" id="pName" placeholder="Örn: Lazanya">
            </div>
            <div class="form-group">
                <label>Kategori</label>
                <select id="pCategory">
                    <option>Başlangıçlar</option><option>Makarnalar</option><option>Risottolar</option><option>Yan Ürünler</option><option>Tatlılar</option><option>İçecekler</option>
                </select>
            </div>
            <div class="form-group">
                <label>Normal Fiyat (Üstü Çizili TL)</label>
                <input type="number" id="pOldPrice" placeholder="550">
            </div>
            <div class="form-group">
                <label>İndirimli Fiyat (Güncel TL)</label>
                <input type="number" id="pPrice" placeholder="440">
            </div>
            <div class="form-group full">
                <label>Açıklama</label>
                <textarea id="pDesc" rows="2" placeholder="İçindeki malzemeler..."></textarea>
            </div>
            <div class="form-group full">
                <label>Yemek Fotoğrafı Seç (JPEG, PNG vb.)</label>
                <input type="file" id="pImageFile" accept="image/*">
                <small style="color: #7f8fa6;">Seçilen fotoğraf otomatik olarak optimize edilip yüklenecektir.</small>
            </div>
            <div class="form-group full">
                <button id="saveBtn" class="btn">Ürünü Kaydet</button>
                <p id="statusMsg" style="color:green; font-size:14px;"></p>
            </div>
        </div>

        <table>
            <thead>
                <tr><th>Resmi</th><th>İsim</th><th>Kategori</th><th>Fiyat</th><th>İşlem</th></tr>
            </thead>
            <tbody id="productTable"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbtWAtTPpA7cNlddGdFyYMEli9O52TVxQ",
            authDomain: "yakinkafe.firebaseapp.com",
            projectId: "yakinkafe",
            storageBucket: "yakinkafe.firebasestorage.app",
            messagingSenderId: "706625633005",
            appId: "1:706625633005:web:3d7efed129b2d0d895eae4",
            measurementId: "G-THPJ9R183N"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('loginBtn').onclick = () => {
            const e = document.getElementById('email').value, p = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, e, p).catch(() => document.getElementById('errorMsg').style.display = 'block');
        };
        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                loadAdminMenu();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
            }
        });

        // Resmi otomatik boyutlandıran ve optimize eden akıllı fonksiyon (Resize)
        const resizeAndConvertImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        // Maksimum genişlik/yükseklik sınırı (Menü için ideal boyut: 500px)
                        const MAX_SIZE = 500;
                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // JPEG formatına sıkıştırarak çevir (Kalite: %80)
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        resolve(dataUrl);
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        };

        document.getElementById('saveBtn').onclick = async () => {
            const btn = document.getElementById('saveBtn');
            const msg = document.getElementById('statusMsg');
            const fileInput = document.getElementById('pImageFile');
            const name = document.getElementById('pName').value;
            const category = document.getElementById('pCategory').value;
            const oldPrice = document.getElementById('pOldPrice').value;
            const price = document.getElementById('pPrice').value;
            const desc = document.getElementById('pDesc').value;

            if(!name || !price || fileInput.files.length === 0) return alert("İsim, fiyat ve resim seçimi zorunludur!");
            
            btn.innerText = "Fotoğraf Sıkıştırılıyor & Kaydediliyor...";
            try {
                // Resmi küçültüp optimize et
                const imageUrl = await resizeAndConvertImage(fileInput.files[0]);
                
                // Firestore'a kaydet
                await addDoc(collection(db, "products"), {
                    name, category, oldPrice, price, desc, imageUrl, createdAt: new Date()
                });

                msg.innerText = "Ürün başarıyla eklendi!";
                setTimeout(() => msg.innerText = "", 3000);
                
                document.getElementById('pName').value = '';
                document.getElementById('pOldPrice').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pDesc').value = '';
                fileInput.value = '';
                
                loadAdminMenu();
            } catch (e) {
                console.error(e);
                alert("Ürün kaydedilirken hata oluştu!");
            }
            btn.innerText = "Ürünü Kaydet";
        };

        async function loadAdminMenu() {
            const tbody = document.getElementById('productTable');
            tbody.innerHTML = '<tr><td colspan="5">Yükleniyor...</td></tr>';
            const snapshot = await getDocs(collection(db, "products"));
            tbody.innerHTML = '';
            
            snapshot.forEach(d => {
                const item = d.data();
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${item.imageUrl}" alt="Yemek"></td>
                    <td>${item.name}</td>
                    <td>${item.category}</td>
                    <td>${item.price} TL</td>
                    <td><button class="btn btn-red btn-sm" onclick="deleteProduct('${d.id}')">Sil</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.deleteProduct = async (id) => {
            if(confirm("Bu ürünü silmek istediğinize emin misiniz?")) {
                await deleteDoc(doc(db, "products", id));
                loadAdminMenu();
            }
        };
    </script>
</body>
</html>
